name: Build Android APK

on:
  push:
    branches:
      - "arena/019ffc7c-lyr"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write # Release তৈরি করার অনুমতি দেওয়ার জন্য 'write' করা হয়েছে

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle wrapper to run
        run: chmod +x gradlew

      - name: Build installable debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-overlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # --- নিচে নতুন Release তৈরির স্টেপ যোগ করা হলো ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Debug Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          
